# router-network default configuration.
# /etc/routeros/network.conf takes precedence over this file.
[Network]
VLANs=10,20,30

[Bridge:br-lan]
Name=br-lan
Address=192.168.10.1/24
# hostapd owns Wi-Fi security; router-network only attaches the port.
Ports=wlan0

[VLAN:10]
Name=lan
Bridge=br-lan
# L3 address lives on br-lan, not on the VLAN subinterface.

[VLAN:20]
Name=guest
Address=192.168.20.1/24

[VLAN:30]
Name=iot
Address=192.168.30.1/24
