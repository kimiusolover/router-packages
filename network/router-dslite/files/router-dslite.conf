# Copy to /etc/routeros/router-dslite.conf to override.
# DS-Lite provides IPv4 Internet over the existing IPv6 WAN.
# It does not depend on DHCPv6-PD (PD may be NoPrefixAvail).

[DSLite]
Enabled=yes

# WAN interface that holds the IPv6 GUA (from RA).
WAN=enp2s0

# AFTR (Address Family Transition Router) IPv6 address or hostname.
# Must be set for apply to succeed. Obtain from ISP / MEC / transix docs.
# Example: AFTR=2001:db8:1:2::1
AFTR=

# Local IPv6 address for the tunnel endpoint (empty = pick primary GUA on WAN).
LocalAddress=

# Tunnel interface name to create when Backend is active.
TunnelInterface=ds-lite

# Backend: stub (validate only), ip6tnl (kernel ip6tnl), jool (requires jool package).
# Keep stub until AFTR and ISP DS-Lite mode are confirmed.
Backend=stub

# IPv4 default route via the tunnel (yes/no).
IPv4DefaultRoute=yes

# Tunnel MTU. DS-Lite encapsulates IPv4 in IPv6; leave empty for backend default.
# Typical starting point: 1460 (adjust after path MTU tests).
MTU=

# Optional IPv4 MSS clamp in bytes (empty = do not set here; leave to firewall).
MSSClamp=
