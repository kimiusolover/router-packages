# Copy to /etc/routeros/router-dslite.conf to override.
# DS-Lite provides IPv4 Internet over the existing IPv6 WAN and does not
# depend on DHCPv6-PD (PD may be NoPrefixAvail).
[DSLite]
Enabled=yes
# WAN interface that holds the IPv6 GUA from RA.
WAN=enp2s0
# Optional AFTR address or hostname. Leave empty for DHCPv6 Option 64,
# then transix DNS discovery from gw.transix.jp. No AFTR address is hard-coded.
AFTR=
# Local IPv6 address for the tunnel endpoint (empty = pick primary WAN GUA).
LocalAddress=
# auto selects the production ip6tnl backend; use stub explicitly for diagnostics.
# Other explicit backends are ip6tnl and jool.
Backend=auto
TunnelInterface=ds-lite
# Add a DS-Lite default route only after tunnel creation succeeds.
IPv4DefaultRoute=yes
# Dedicated metric avoids replacing an existing native IPv4 default.
IPv4RouteMetric=50
# Tunnel MTU; leave empty to use the kernel default until path tests exist.
MTU=
# B4 address from RFC 6333 reserved range; route stage uses 192.0.0.1 as peer.
B4Address=192.0.0.2/29
# Manage IPv4 forwarding for LAN-to-DS-Lite. Previous sysctl value is restored on stop.
IPv4Forwarding=yes
# Comma-separated router-network VLAN interface names.
LANInterfaces=lan,guest,iot
# allow installs only the package-owned stateful rules; disabled/no skips nft.
Firewall=allow
MSSClamp=
# DHCPv6 hook input/output defaults:
#   /run/routeros/dslite/aftr-name -> /run/routeros/dslite/aftr
