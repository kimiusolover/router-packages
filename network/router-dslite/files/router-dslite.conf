# Copy to /etc/routeros/router-dslite.conf to override.
# DS-Lite provides IPv4 Internet over the existing IPv6 WAN and does not
# depend on DHCPv6-PD (PD may be NoPrefixAvail).
[DSLite]
Enabled=yes
# WAN interface that holds the IPv6 GUA from RA.
WAN=enp2s0
# Optional AFTR address or hostname. BB.excite光 MEC does not require users
# to enter one; automatic discovery/selection is future backend work.
AFTR=
# Local IPv6 address for the tunnel endpoint (empty = pick primary WAN GUA).
LocalAddress=
# auto selects the currently available skeleton backend; explicit backends
# are stub, ip6tnl, and jool.
Backend=auto
TunnelInterface=ds-lite
IPv4DefaultRoute=yes
# Tunnel MTU; leave empty until a real backend and path tests exist.
MTU=
MSSClamp=
