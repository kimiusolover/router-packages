name: package-plan checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate package plans and locked inputs
        run: make check
      - name: Verify real preview package builds
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools zstd binutils gcc
          make test-preview-package
