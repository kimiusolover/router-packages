name: commit trailer policy (PR head test)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  commit-trailer-policy-head-test:
    name: commit-trailer-policy-head-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base commit only
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout pinned routerctl verifier
        uses: actions/checkout@v6
        with:
          repository: kimiusolover/routerctl
          ref: c57256536a845511002423c0601f845c1724343d
          path: routerctl
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go without cache
        uses: actions/setup-go@v7
        with:
          go-version-file: routerctl/go.mod
          cache: false

      - name: Fetch PR commits without checking out PR code
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -o errexit -o nounset -o pipefail
          git fetch --no-tags origin "+refs/pull/$PR_NUMBER/head:refs/remotes/origin/pr-$PR_NUMBER"
          fetched_head="$(git rev-parse "refs/remotes/origin/pr-$PR_NUMBER")"
          if [[ "$fetched_head" != "$HEAD_SHA" ]]; then
            echo "PR head changed during this run; wait for the latest synchronize run."
            exit 1
          fi
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          git checkout --detach "$BASE_SHA"

      - name: Verify pull request commit trailers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -o errexit -o nounset -o pipefail
          commits="$(git rev-list --reverse "$BASE_SHA..$HEAD_SHA")"
          if [[ -z "$commits" ]]; then
            echo "No pull request commits to verify."
            exit 0
          fi
          while IFS= read -r commit; do
            echo "Verifying $commit"
            (
              cd routerctl
              go run ./cmd/routerctl verify commit --repo .. --profile package "$commit"
            )
          done <<< "$commits"
